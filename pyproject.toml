[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scan"
version = "0.1.0"
description = "CLI-only authorized LLM assessment tool: behavioral fingerprinting and safe prompt-injection testing."
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
requires-python = ">=3.11"
authors = [{ name = "Electric Entropy" }]
keywords = ["security", "llm", "prompt-injection", "fingerprint", "assessment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.0",
    # Build backend must be present in the env for the artifact tests'
    # `python -m build --no-isolation` (Python 3.12 venvs don't ship setuptools).
    "setuptools>=68",
    "wheel>=0.42",
]

[project.scripts]
ai-scan = "ai_scan.cli:main"

[project.urls]
Homepage = "https://github.com/electric-entropy/ai-scan"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_scan = [
    "payloads/*.json",
    "schemas/*.schema.json",
    "packs/builtin/*.json",
    "reporting/templates/*.html",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
packages = ["ai_scan"]
mypy_path = "src"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
