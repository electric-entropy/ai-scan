name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Least privilege: building/uploading workflow artifacts needs only read access.
permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # --- Release gates: ALL must pass before any artifact is uploaded. ---

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from importlib import metadata
          tag = os.environ["TAG_NAME"].lstrip("v")
          version = metadata.version("ai-scan")
          assert tag == version, f"tag {tag!r} does not match project version {version!r}"
          print(f"tag matches version {version}")
          PY

      - name: Credential scan
        run: python -m scripts.credential_scan --root .

      - name: Contract tests
        run: python -m pytest tests/contracts -q

      - name: Full tests
        run: python -m pytest -q

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Build distributions
        run: python -m build

      - name: Verify wheel metadata and resources
        run: |
          python -m venv /tmp/ai-scan-package-smoke
          /tmp/ai-scan-package-smoke/bin/python -m pip install --upgrade pip
          /tmp/ai-scan-package-smoke/bin/pip install dist/*.whl
          /tmp/ai-scan-package-smoke/bin/ai-scan --help
          /tmp/ai-scan-package-smoke/bin/ai-scan doctor
          /tmp/ai-scan-package-smoke/bin/python - <<'PY'
          from importlib import metadata, resources
          dist = metadata.distribution('ai-scan')
          meta = dist.metadata
          assert meta.get('License-Expression') == 'LicenseRef-PolyForm-Shield-1.0.0'
          assert 'LICENSE' in meta.get_all('License-File', [])
          root = resources.files('ai_scan')
          for rel in (
              'py.typed',
              'schemas/target-v1.schema.json',
              'schemas/engagement-v1.schema.json',
              'schemas/plan-v1.schema.json',
              'schemas/pack-v1.schema.json',
              'schemas/evidence-v2.schema.json',
              'schemas/finding-v2.schema.json',
              'payloads/safe.json',
              'packs/builtin/direct-injection-reliable-v1.json',
              'reporting/templates/report.html',
          ):
              assert root.joinpath(rel).is_file(), rel
          PY

      - name: Dependency audit
        run: |
          python - <<'PY'
          from importlib import metadata
          deps = metadata.metadata('ai-scan').get_all('Requires-Dist') or []
          runtime_deps = [d for d in deps if 'extra ==' not in d]
          assert runtime_deps == [], runtime_deps
          print('runtime dependencies: none')
          PY

      - name: Generate and validate SBOM
        run: python -m scripts.generate_sbom --out sbom.cdx.json

      - name: Reproducible build check
        run: python -m scripts.reproducible_build

      - name: Container worker hardened protocol smoke
        run: |
          test -f Dockerfile.worker
          test -f .dockerignore
          grep -q '^USER ' Dockerfile.worker
          grep -q 'network none' docs/container-worker.md
          docker build -f Dockerfile.worker -t ai-scan-worker:release .
          uid="$(docker run --rm --entrypoint id ai-scan-worker:release -u)"
          test "$uid" != "0"
          expected='{"protocol_version":"worker-v1","operation":"ping","payload":""}'
          actual="$(printf '%s' "$expected" | docker run --rm --interactive --read-only --network none --cap-drop ALL --security-opt no-new-privileges --user 65532:65532 --workdir /work --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m --tmpfs /work:rw,noexec,nosuid,nodev,size=16m ai-scan-worker:release)"
          test "$actual" = '{"output":"pong","protocol_version":"worker-v1","status":"ok"}'

      - name: Artifact contents listing
        run: |
          python - <<'PY'
          import json, tarfile, zipfile
          from pathlib import Path
          listing = {}
          for artifact in sorted(Path('dist').iterdir()):
              if artifact.suffix == '.whl':
                  with zipfile.ZipFile(artifact) as zf:
                      listing[artifact.name] = sorted(zf.namelist())
              elif artifact.name.endswith('.tar.gz'):
                  with tarfile.open(artifact, 'r:gz') as tf:
                      listing[artifact.name] = sorted(tf.getnames())
          listing['sbom.cdx.json'] = json.loads(Path('sbom.cdx.json').read_text(encoding='utf-8'))
          Path('dist/artifact-contents.json').write_text(
              json.dumps(listing, indent=2, sort_keys=True) + '\n'
          )
          PY

      # --- Only reached when every gate above passed. ---
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-scan-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
            dist/artifact-contents.json
