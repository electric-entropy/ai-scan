name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref so stale jobs don't waste minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Secret scan
        run: python -m scripts.credential_scan --root .

      - name: Contract tests
        run: python -m pytest tests/contracts -q

      - name: Full tests
        run: python -m pytest -q

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Build wheel and sdist
        run: python -m build

      - name: Fresh wheel install and package-resource smoke
        run: |
          python -m venv /tmp/ai-scan-wheel-smoke
          /tmp/ai-scan-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/ai-scan-wheel-smoke/bin/pip install dist/*.whl
          /tmp/ai-scan-wheel-smoke/bin/ai-scan --help
          /tmp/ai-scan-wheel-smoke/bin/ai-scan doctor
          /tmp/ai-scan-wheel-smoke/bin/python - <<'PY'
          from importlib import metadata, resources
          dist = metadata.distribution('ai-scan')
          meta = dist.metadata
          assert meta.get('License-Expression') == 'LicenseRef-PolyForm-Shield-1.0.0'
          assert 'LICENSE' in meta.get_all('License-File', [])
          root = resources.files('ai_scan')
          required = [
              'py.typed',
              'schemas/target-v1.schema.json',
              'schemas/engagement-v1.schema.json',
              'schemas/plan-v1.schema.json',
              'schemas/pack-v1.schema.json',
              'schemas/evidence-v2.schema.json',
              'schemas/finding-v2.schema.json',
              'payloads/safe.json',
              'packs/builtin/direct-injection-reliable-v1.json',
              'reporting/templates/report.html',
          ]
          for rel in required:
              assert root.joinpath(rel).is_file(), rel
          PY

      - name: Dependency audit and SBOM
        run: |
          python - <<'PY'
          from importlib import metadata
          deps = metadata.metadata('ai-scan').get_all('Requires-Dist') or []
          runtime_deps = [d for d in deps if 'extra ==' not in d]
          assert runtime_deps == [], runtime_deps
          print('runtime dependencies: none')
          PY

      - name: Generate and validate SBOM artifact
        run: python -m scripts.generate_sbom --out sbom.cdx.json

      - name: Reproducible build check
        if: matrix.python-version == '3.12'
        run: python -m scripts.reproducible_build

      - name: Container worker static scan
        if: matrix.python-version == '3.12'
        run: |
          test -f Dockerfile.worker
          test -f .dockerignore
          grep -q '^USER ' Dockerfile.worker
          grep -q 'network none' docs/container-worker.md
          docker build -f Dockerfile.worker -t ai-scan-worker:ci .
          # Fail closed unless the image runs as a non-root user.
          uid="$(docker run --rm --entrypoint id ai-scan-worker:ci -u)"
          test "$uid" != "0"
